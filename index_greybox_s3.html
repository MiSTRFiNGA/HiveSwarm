<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HiVE SWARM ΓÇö Greybox</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#091014;color:#dce9e7;font:14px system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none}#hint{position:fixed;inset:auto 0 18px;text-align:center;color:#94aaa7;pointer-events:none;letter-spacing:.05em}#hint b{color:#e4fff8}
</style></head><body><canvas id="game"></canvas><div id="hint"><b>WASD / ARROWS</b> to move ┬╖ weapons fire automatically ┬╖ survive the swarm</div>
<script>
'use strict';
// S.3 greybox core: world-space simulation. Deliberately contains no lanes, horizon, road, or gates.
const canvas=document.querySelector('#game'), ctx=canvas.getContext('2d');
const VIEW={w:540,h:960}, WORLD={halfW:810,halfH:1440,maxEnemies:220}, CAMERA={deadZone:.15}; let dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);VIEW.w=innerWidth;VIEW.h=innerHeight} addEventListener('resize',resize);resize();
const keys=new Set(), pointer={active:false,x:0,y:0};
addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
canvas.addEventListener('pointerdown',e=>{pointer.active=true;pointer.x=e.clientX;pointer.y=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(pointer.active){pointer.x=e.clientX;pointer.y=e.clientY}});canvas.addEventListener('pointerup',()=>pointer.active=false);
const player={x:0,y:0,r:16,hp:100,maxHp:100,speed:245,inv:0,angle:0};
let cam={x:0,y:0}, enemies=[], bullets=[], particles=[], elapsed=0, score=0, wave=1, spawnClock=0, fireClock=0, shake=0, state='title';
const WEAPON={name:'Pulse Carbine',damage:17,rate:.18,speed:720,shots:1,pierce:1,color:'#b7fff5'};
const ENEMIES=[{name:'drone',r:12,hp:28,speed:72,damage:8,color:'#9ab0b4',weight:7},{name:'brute',r:20,hp:95,speed:42,damage:16,color:'#e5a66e',weight:2},{name:'runner',r:9,hp:17,speed:128,damage:6,color:'#e97088',weight:4}];
function reset(){Object.assign(player,{x:0,y:0,hp:100,inv:0,angle:0});cam={x:0,y:0};enemies=[];bullets=[];particles=[];elapsed=score=wave=spawnClock=fireClock=shake=0;state='play'}
function rand(a,b){return a+Math.random()*(b-a)} function dist2(a,b){let x=a.x-b.x,y=a.y-b.y;return x*x+y*y}
function spawnEnemy(){if(enemies.length>=WORLD.maxEnemies)return;let a=Math.random()*Math.PI*2, distance=Math.hypot(VIEW.w,VIEW.h)*.72+rand(60,180), level=1+Math.floor(elapsed/30);let roll=Math.random()*(13+level*.55), type=roll>11?ENEMIES[1]:roll>7?ENEMIES[2]:ENEMIES[0],x=Math.max(-WORLD.halfW+type.r,Math.min(WORLD.halfW-type.r,player.x+Math.cos(a)*distance)),y=Math.max(-WORLD.halfH+type.r,Math.min(WORLD.halfH-type.r,player.y+Math.sin(a)*distance));enemies.push({x,y,r:type.r,hp:type.hp*(1+level*.13),maxHp:type.hp*(1+level*.13),speed:type.speed*(1+level*.025),damage:type.damage,type,color:type.color,hit:0});}
function fire(){let target=null,best=Infinity;for(const e of enemies){let d=dist2(player,e);if(d<best){best=d;target=e}}if(!target)return;let a=Math.atan2(target.y-player.y,target.x-player.x);player.angle=a;for(let i=0;i<WEAPON.shots;i++){let spread=(i-(WEAPON.shots-1)/2)*.1;bullets.push({x:player.x+Math.cos(a)*20,y:player.y+Math.sin(a)*20,vx:Math.cos(a+spread)*WEAPON.speed,vy:Math.sin(a+spread)*WEAPON.speed,r:4,damage:WEAPON.damage,pierce:WEAPON.pierce,life:1.05})}}
function burst(x,y,color,n=8){for(let i=0;i<n;i++){let a=Math.random()*6.283,s=rand(25,140);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.55),color})}}
function followCamera(){let dx=player.x-cam.x,dy=player.y-cam.y,deadX=VIEW.w*CAMERA.deadZone,deadY=VIEW.h*CAMERA.deadZone;if(Math.abs(dx)>deadX)cam.x+=dx-Math.sign(dx)*deadX;if(Math.abs(dy)>deadY)cam.y+=dy-Math.sign(dy)*deadY;cam.x=Math.max(-WORLD.halfW+VIEW.w/2,Math.min(WORLD.halfW-VIEW.w/2,cam.x));cam.y=Math.max(-WORLD.halfH+VIEW.h/2,Math.min(WORLD.halfH-VIEW.h/2,cam.y));}
function update(dt){if(state!=='play')return;elapsed+=dt;wave=1+Math.floor(elapsed/30);player.inv=Math.max(0,player.inv-dt);let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);if(pointer.active){dx=pointer.x-VIEW.w/2;dy=pointer.y-VIEW.h/2}let mag=Math.hypot(dx,dy);if(mag){player.x+=dx/mag*player.speed*dt;player.y+=dy/mag*player.speed*dt;player.angle=Math.atan2(dy,dx)}player.x=Math.max(-WORLD.halfW+player.r,Math.min(WORLD.halfW-player.r,player.x));player.y=Math.max(-WORLD.halfH+player.r,Math.min(WORLD.halfH-player.r,player.y));followCamera();
spawnClock-=dt;let interval=Math.max(.13,.68-wave*.034);if(spawnClock<=0){spawnClock+=interval;spawnEnemy()}fireClock-=dt;if(fireClock<=0){fireClock+=WEAPON.rate;fire()}
for(let i=enemies.length-1;i>=0;i--){let e=enemies[i],vx=player.x-e.x,vy=player.y-e.y,d=Math.hypot(vx,vy)||1;e.x+=vx/d*e.speed*dt;e.y+=vy/d*e.speed*dt;e.hit=Math.max(0,e.hit-dt);if(d<e.r+player.r){if(!player.inv){player.hp-=e.damage;player.inv=.45;shake=8;burst(player.x,player.y,'#ff718a',14);if(player.hp<=0){player.hp=0;state='dead'}}e.x-=vx/d*20;e.y-=vy/d*20}}
for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let removed=b.life<=0;for(let j=enemies.length-1;j>=0&&!removed;j--){let e=enemies[j],r=e.r+b.r;if((e.x-b.x)**2+(e.y-b.y)**2<r*r){e.hp-=b.damage;e.hit=.1;burst(b.x,b.y,WEAPON.color,3);b.pierce--;if(e.hp<=0){score+=10;burst(e.x,e.y,e.color,12);enemies.splice(j,1)}if(b.pierce<0)removed=true}}if(removed)bullets.splice(i,1)}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}shake=Math.max(0,shake-dt*25)}
function sx(x){return x-cam.x+VIEW.w/2}function sy(y){return y-cam.y+VIEW.h/2}
function draw(){ctx.fillStyle='#091014';ctx.fillRect(0,0,VIEW.w,VIEW.h);let ox=rand(-shake,shake),oy=rand(-shake,shake);ctx.save();ctx.translate(ox,oy);ctx.strokeStyle='#142329';ctx.lineWidth=1;let grid=80,startX=(-cam.x%grid+grid)%grid,startY=(-cam.y%grid+grid)%grid;for(let x=startX;x<VIEW.w;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,VIEW.h);ctx.stroke()}for(let y=startY;y<VIEW.h;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(VIEW.w,y);ctx.stroke()}
for(const p of particles){ctx.globalAlpha=Math.min(1,p.life*3);ctx.fillStyle=p.color;ctx.fillRect(sx(p.x)-2,sy(p.y)-2,4,4)}ctx.globalAlpha=1;for(const b of bullets){ctx.fillStyle=WEAPON.color;ctx.shadowColor=WEAPON.color;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(sx(b.x),sy(b.y),b.r,0,7);ctx.fill()}ctx.shadowBlur=0;
for(const e of enemies){let x=sx(e.x),y=sy(e.y);ctx.fillStyle=e.hit?'#fff':e.color;ctx.beginPath();ctx.arc(x,y,e.r,0,7);ctx.fill();ctx.fillStyle='#152025';ctx.fillRect(x-e.r,y-e.r-8,e.r*2,3);ctx.fillStyle='#8aff9b';ctx.fillRect(x-e.r,y-e.r-8,e.r*2*(e.hp/e.maxHp),3)}
let px=sx(player.x),py=sy(player.y);ctx.save();ctx.translate(px,py);ctx.rotate(player.angle);ctx.fillStyle=player.inv?'#ffffff':'#6fffe2';ctx.beginPath();ctx.arc(0,0,player.r,0,7);ctx.fill();ctx.fillStyle='#dff';ctx.fillRect(8,-4,22,8);ctx.restore();ctx.restore();
ctx.fillStyle='#dce9e7';ctx.font='700 16px system-ui';ctx.fillText('HiVE SWARM  ┬╖  WAVE '+wave,18,32);ctx.font='14px system-ui';ctx.fillStyle='#a5c3be';ctx.fillText('SURVIVAL '+formatTime(elapsed)+'   SCORE '+score+'   HOSTILES '+enemies.length,18,55);ctx.fillStyle='#26383a';ctx.fillRect(18,70,180,10);ctx.fillStyle=player.hp>30?'#64e7b5':'#ff718a';ctx.fillRect(18,70,180*player.hp/player.maxHp,10);ctx.fillStyle='#dce9e7';ctx.fillText('HP '+Math.ceil(player.hp)+' / '+player.maxHp,205,80);
if(state==='title'||state==='dead'){ctx.fillStyle='rgba(3,8,10,.72)';ctx.fillRect(0,0,VIEW.w,VIEW.h);ctx.textAlign='center';ctx.fillStyle='#e4fff8';ctx.font='700 34px system-ui';ctx.fillText(state==='dead'?'RUN ENDED':'HiVE SWARM',VIEW.w/2,VIEW.h/2-24);ctx.font='16px system-ui';ctx.fillStyle='#b3cbc7';ctx.fillText(state==='dead'?'Score '+score+' ┬╖ survived '+formatTime(elapsed):'Open arena survival greybox',VIEW.w/2,VIEW.h/2+10);ctx.fillStyle='#6fffe2';ctx.fillText('Click or press Enter to deploy',VIEW.w/2,VIEW.h/2+50);ctx.textAlign='left'}}
function formatTime(t){return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')} addEventListener('keydown',e=>{if(e.key==='Enter'&&(state==='title'||state==='dead'))reset()});canvas.addEventListener('click',()=>{if(state==='title'||state==='dead')reset()});
let last=performance.now(),accumulator=0;function frame(now){accumulator+=Math.min(.05,(now-last)/1000);last=now;while(accumulator>=1/60){update(1/60);accumulator-=1/60}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
window.__hiveSwarmDebug=()=>({state,elapsed,score,wave,enemies:enemies.length,player:{x:player.x,y:player.y,hp:player.hp},camera:cam});
</script></body></html>
