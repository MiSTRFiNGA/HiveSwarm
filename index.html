<script>
'use strict';
// S.3 greybox core: world-space simulation. Deliberately contains no lanes, horizon, road, or gates.
const GAME_VERSION='0.6.14';
// S1 (Eric, playtest): HUD sat under the phone's status-bar icons (clock/battery). Read the
// safe-area inset via a probe element (env() only resolves against a real CSS property, not a
// custom property read-back) with a sensible fallback for devices/browsers without the env().
function safeAreaTop(){
  try{
    const probe=document.createElement('div');
    probe.style.cssText='position:fixed;top:0;left:0;height:0;visibility:hidden;padding-top:env(safe-area-inset-top,24px)';
    document.body.appendChild(probe);
    const v=parseFloat(getComputedStyle(probe).paddingTop)||24;
    probe.remove();
    return v;
  }catch(_){return 24}
}
const SAFE_TOP=(typeof document!=='undefined'&&document.body)?safeAreaTop():24;
function hudLayout(){
  const t=SAFE_TOP;
  const stageY=38+t, centerY=38+t, hpY=92+t, hpBottom=102+t, hudBottom=126+t;
  const weaponY=68+t, weaponBarY=weaponY+10, toastY=hudBottom+36;
  return {stageY,centerY,hpY,hpBottom,hudBottom,weaponY,weaponBarY,toastY};
}
window.__swarmHudLayout=hudLayout;
const canvas=document.querySelector('#game'), ctx=canvas.getContext('2d');
const VIEW={w:540,h:960}, WORLD={halfW:810,halfH:1440,maxEnemies:220}, CAMERA={deadZone:.15}; let dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);VIEW.w=innerWidth;VIEW.h=innerHeight} addEventListener('resize',resize);resize();
const keys=new Set(), pointer={active:false,x:0,y:0};
// Virtual thumbstick (owner request 2026-08-03): anchors where the thumb lands; idle rest bottom-centre.
const STICK={home:{x:0,y:0},base:{x:0,y:0},knob:{x:0,y:0},radius:78,dead:0.16,active:false,dx:0,dy:0};
function stickHome(){STICK.home.x=VIEW.w/2;STICK.home.y=VIEW.h-Math.min(150,VIEW.h*0.22);}
function stickSet(x,y){let dx=x-STICK.base.x,dy=y-STICK.base.y,d=Math.hypot(dx,dy);
  if(d>STICK.radius){dx*=STICK.radius/d;dy*=STICK.radius/d;d=STICK.radius}
  STICK.knob.x=STICK.base.x+dx;STICK.knob.y=STICK.base.y+dy;
  let n=d/STICK.radius;if(n<STICK.dead){STICK.dx=STICK.dy=0;return}
  STICK.dx=dx/(d||1);STICK.dy=dy/(d||1);}
function stickRelease(){STICK.active=false;STICK.dx=STICK.dy=0;stickHome();STICK.base.x=STICK.home.x;STICK.base.y=STICK.home.y;STICK.knob.x=STICK.base.x;STICK.knob.y=STICK.base.y;}
stickRelease();addEventListener('resize',stickRelease);

addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
canvas.addEventListener('pointerdown',e=>{if(state!=='play')return;pointer.active=true;pointer.x=e.clientX;pointer.y=e.clientY;canvas.setPointerCapture(e.pointerId);STICK.active=true;STICK.base.x=e.clientX;STICK.base.y=e.clientY;stickSet(e.clientX,e.clientY)});canvas.addEventListener('pointermove',e=>{if(pointer.active){pointer.x=e.clientX;pointer.y=e.clientY;if(STICK.active)stickSet(e.clientX,e.clientY)}});canvas.addEventListener('pointerup',()=>{pointer.active=false;stickRelease()});canvas.addEventListener('pointercancel',()=>{pointer.active=false;stickRelease()});

// ---- FORGE values ----
const FORGE_KEY='hive_swarm_forge_values_v1', copy=o=>JSON.parse(JSON.stringify(o));
// G6 root cause (2026-08-05): budgetBase:4 spawned ~4.4 hostiles/sec on wave 1. A standing
// player was buried by ~60 bodies before the first pack even finished arriving (~15s travel),
// then contact-DPS (~8 dmg / 0.45s iframe ≈ 18 HP/s) finished them by ~12–21s. Survivors-likes
// open near 1 spawn/sec and ramp; HP was never the lever.
// MOVEMENT FEEL (owner 2026-08-13: "add drag or resistance or something to be able to adjust the
// feel of how the character pawn moves ... put these settings inside forge so I can tweak as I
// test"). accel/brake/friction are live FORGE fields — see the movement block in update().
// The shipped values are deliberately close to the OLD instant-response behaviour (accel 2600 gets
// the pawn to the 245px/s top speed in ~0.09s) so this lands as a tuning knob, not a stealth nerf
// to how the game already felt. Turn accel down for weight, brake down for ice.
const FORGE_BASE={player:{speed:245,maxHp:100,pickupRadius:90,scale:1,accel:2600,brake:3400,friction:4,hullSize:.6,turretRatio:1.4,droneScale:1,droneGlow:1},world:{halfW:810,halfH:1440,maxEnemies:220,deadZone:.15},waves:{seconds:30,baseInterval:.68,intervalPerWave:.034,budgetBase:1.15,budgetExponent:1.065},drops:{xp:1,metaChance:.08,healChance:.07,heal:12,weaponChance:.05,eliteWeaponChance:.4},weapons:[
  // dropWeight = relative odds this gun is picked when a field cache rolls a weapon drop
  // (maybeDropWeapon does a weighted pick over EDIT.weapons; 1 = baseline, all guns shipped equal).
  // 2026-08-13 RANGE BASELINE (owner: "make all weapons length be 100 to start, and upgrades make
  // them shoot further, except homing missiles, they stay same"). Every weapon EXCEPT weapon.seeker
  // (kind:'homing') now ships range:100. The number is deliberately a round baseline the owner
  // intends to hand-tune per gun — see wRange() for why nothing downstream hardcodes it.
  {id:'weapon.pulse',name:'Pulse Carbine',kind:'bullet',damage:18,rate:.16,speed:820,shots:1,pierce:2,color:'#5dfff0',range:100,dropWeight:1,sfx:'m41a-pulse-rifle.mp3',icon:0},
  // RANGE EXEMPTION: the Heat Seeker keeps range:900 and is the ONE weapon wRange() never scales
  // (owner: "except homing missiles, they stay same"). A homing missile that ran out of reach after
  // 100px would never get to home on anything — reach IS the weapon.
  {id:'weapon.seeker',name:'Heat Seeker',kind:'homing',damage:22,rate:.38,speed:420,shots:1,pierce:0,color:'#ff6b3d',range:900,turn:7.5,dropWeight:1,sfx:'magic-spell.mp3',icon:1},
  // Flamethrower replaces the old unguided multi-shot launcher weapon (owner 2026-08-08): Heat
  // Seeker ('homing') already covered the "explosive projectile" niche, making that weapon
  // redundant, and this game had no cone weapon (HiVE WAR's flamethrower). kind:'flame' is a CONTINUOUS cone, not a discrete
  // projectile — see the kind==='flame' branch in fire() — so it is excluded from
  // scatter/pierce/ricochet (same treatment as beam/chain) but keeps rapid/knockback/overcharge.
  // No dedicated flame SFX ships in assets/SFX, so it reuses light-machine-gun.mp3 (closest
  // existing continuous-fire sample) rather than a one-shot cue like grenade.mp3.
  {id:'weapon.flame',name:'Flamethrower',kind:'flame',damage:9,rate:.06,speed:0,shots:1,pierce:99,color:'#ff9a3d',range:100,flameWidth:38,flameLength:100,burnDps:40,burnTime:2.2,dropWeight:1,sfx:'light-machine-gun.mp3',icon:5},
  {id:'weapon.beam',name:'Breach Laser',kind:'beam',damage:28,rate:.08,speed:0,shots:1,pierce:99,color:'#6ea8ff',range:200,width:6,dropWeight:1,coreColor:'#eaffff',glowWidth:24,coreWidth:2.4,pulseRate:16,sfx:'electric-explosive.mp3',icon:2},
  {id:'weapon.chain',name:'Storm Arc',kind:'chain',damage:22,rate:.32,speed:0,shots:1,pierce:4,color:'#d7a6ff',range:200,jumps:4,dropWeight:1,coreWidth:3.4,glowWidth:15,glowIntensity:1.15,sfx:'lightning01.mp3',icon:3},
  {id:'weapon.nova',name:'Nova Shell',kind:'nova',damage:34,rate:.55,speed:340,shots:1,pierce:0,color:'#ffe066',range:100,blast:78,dropWeight:1,shards:3,sfx:'grenade.mp3',icon:4},
  // S.7 poison fields, all FORGE-editable: dot = damage/sec while infected, dotTime = seconds
  // an infection lasts, spreadChance = per-second chance a carrier infects a clean neighbour,
  // spreadRadius = how close that neighbour must be, spreadFactor = potency the infection is
  // passed on at (0.7 = each generation is 30% weaker, so a plague fades instead of snowballing).
  // 2026-08-06 feel pass (Eric: "have to run away until they die and it is slow"): dot raised
  // 8->16 and dotTime cut 3->2.2 so the DoT is FRONT-LOADED (kills land faster instead of a slow
  // kite-and-wait burn — Eric said he'll personally retune `dot` further, keep it FORGE-editable).
  // poisonStackMax = re-hitting an already-infected target now STACKS extra dps (capped) instead
  // of doing nothing, so sustained fire on a saturated field ramps up instead of idling.
  // slowFactor = poisoned enemies move at this fraction of normal speed, so you don't have to
  // kite/run away waiting for the DoT — the target is defanged the moment it's infected.
  {id:'weapon.poison',name:'Toxin Injector',kind:'poison',damage:6,rate:.5,speed:600,shots:1,pierce:1,color:'#7cff4f',range:100,dot:16,dotTime:2.2,spreadChance:.9,spreadRadius:52,spreadFactor:.7,poisonStackMax:3,slowFactor:.6,dropWeight:1,sfx:'subterrahit.mp3',icon:4}
],entities:[{id:'enemy.shambler',name:'Shambler',r:16,hp:26,speed:68,damage:6,color:'#9ab0b4',weight:7,dropXp:1,unlockWave:1,sprite:'art_src/topdown_v1/shambler.png'},{id:'enemy.slime',name:'Hive Slime',r:18,hp:34,speed:52,damage:7,color:'#c48cff',weight:4,dropXp:1,unlockWave:2,sprite:'art_src/topdown_v1/slime.png'},{id:'enemy.runner',name:'Runner',r:14,hp:17,speed:128,damage:6,color:'#e97088',weight:4,dropXp:1,unlockWave:3,sprite:'art_src/topdown_v1/runner.png'},{id:'enemy.nodeSpawn',name:'Node Spawn',r:16,hp:48,speed:78,damage:8,color:'#9a6ad8',weight:3,dropXp:2,unlockWave:4,sprite:'art_src/topdown_v1/node_spawn.png'},{id:'enemy.crawler',name:'Crawler',r:15,hp:38,speed:96,damage:10,color:'#b5bd76',weight:3,dropXp:2,unlockWave:5,sprite:'art_src/topdown_v1/crawler.png'},{id:'enemy.psychoid',name:'Psychoid',r:18,hp:44,speed:86,damage:8,color:'#c46cff',weight:3,dropXp:2,unlockWave:5,sprite:'art_src/topdown_v1/psychoid.png'},{id:'enemy.necroNode',name:'Necro Node',r:23,hp:140,speed:0,damage:8,color:'#a46fca',weight:1,dropXp:5,unlockWave:6,sprite:'art_src/topdown_v1/necro_node.png'},{id:'enemy.biomorph',name:'Biomorph',r:16,hp:28,speed:138,damage:8,color:'#7b6cff',weight:4,dropXp:2,unlockWave:7,sprite:'art_src/topdown_v1/biomorph.png'},{id:'enemy.brute',name:'Brute',r:24,hp:95,speed:42,damage:16,color:'#e5a66e',weight:2,dropXp:3,unlockWave:8,sprite:'art_src/topdown_v1/brute.png'},{id:'enemy.cyberMutant',name:'Cyber Mutant',r:22,hp:160,speed:60,damage:16,color:'#c46cff',weight:2,dropXp:5,unlockWave:8,sprite:'art_src/topdown_v1/cyber_mutant.png'},{id:'enemy.armored',name:'Armored Dead',r:20,hp:120,speed:54,damage:14,color:'#71889b',weight:2,dropXp:4,unlockWave:9,sprite:'art_src/topdown_v1/armored_dead.png'},{id:'enemy.mutant',name:'Mutant Enforcer',r:21,hp:175,speed:68,damage:20,color:'#d86c67',weight:1,dropXp:7,unlockWave:10,sprite:'art_src/topdown_v1/mutant_enforcer.png'},{id:'enemy.colossus',name:'Zombie Colossus',r:42,hp:1200,speed:32,damage:35,color:'#8b765f',weight:1,dropXp:20,unlockWave:11,sprite:'art_src/topdown_v1/zombie_colossus.png'},{id:'enemy.praetorian',name:'Praetorian',r:28,hp:320,speed:48,damage:26,color:'#5cff7a',weight:0,dropXp:14,unlockWave:99,sprite:'art_src/topdown_v1/praetorian.png'}],codexPages:null,
// STAGE system (owner request 2026-08-06): discrete stages replace the pure-endless timer.
// Each stage = its own backdrop palette + a roster cap (which entities can spawn) + a duration
// before a boss (a scaled-up existing entity, no new art needed) spawns. Killing the boss opens
// a between-stage break (upgrade card + continue), then the next stage begins. Data-driven so
// FORGE/DATA tab JSON export can retune name/seconds/enemyCap/bg/bossMul later without code edits.
stages:[
  {id:'stage.outskirts',name:'Outskirts',seconds:60,enemyCap:3,bg:['#0a1622','#142434'],bgArt:'art_src/stages/outskirts.jpg',obstacleArt:'art_src/obstacles/outskirts.png',bossMul:6,bossId:'boss.outskirts'},
  {id:'stage.sewers',name:'Sewers',seconds:75,enemyCap:6,bg:['#0d1a12','#16301f'],bgArt:'art_src/stages/sewers.jpg',obstacleArt:'art_src/obstacles/sewers.png',bossMul:7,bossId:'boss.sewers'},
  {id:'stage.downtown',name:'Downtown',seconds:90,enemyCap:9,bg:['#160c1e','#2a1638'],bgArt:'art_src/stages/downtown.jpg',obstacleArt:'art_src/obstacles/downtown.png',bossMul:8,bossId:'boss.downtown'},
  {id:'stage.highway',name:'Highway',seconds:105,enemyCap:13,bg:['#1c0a0a','#3a1414'],bgArt:'art_src/stages/highway.jpg',obstacleArt:'art_src/obstacles/highway.png',bossMul:9,bossId:'boss.highway'},
  {id:'stage.hivecore',name:'HiVE Core',seconds:120,enemyCap:99,bg:['#050b14','#111b2c'],bgArt:'art_src/stages/hivecore.jpg',obstacleArt:'art_src/obstacles/hivecore.png',bossMul:12,bossId:'boss.hivecore'}
],
// PER-STAGE BOSS SLOTS (owner 2026-08-08, "each boss has its own slot in bosses"): first-class,
// FORGE-editable guardians. `baseEntityId` picks which shipped entity's sprite/anim the boss borrows
// (no new art needed, same as the old derive-from-roster behaviour); everything else is the boss's

  if(typeof HTMLElement==='undefined'){acceptContinue();return} // headless: always accept, exercises the revive path
  const prev=document.getElementById('continue');if(prev)prev.remove();
  let box=document.createElement('div');box.id='continue';box.className='overlay';
  box.innerHTML='<h2>CONTINUE?</h2><div class="hint">Score '+score+' · Stage '+(stage+1)+' · '+(continuesAllowed()-continuesUsed)+' continue(s) left</div>'+
    '<button id="contYes" style="width:220px;padding:14px;margin:6px;background:#16383a;color:#eafffa;border:1px solid #75f0db;border-radius:8px">▶ CONTINUE</button>'+
    '<button id="contNo" style="width:220px;padding:14px;margin:6px;background:#331616;color:#eafffa;border:1px solid #a55;border-radius:8px">✕ END RUN</button>';
  document.body.append(box);

}
// Level-ups QUEUE rather than re-enter. offerCards() used to be called straight from the pickup
// collision loop, once per orb crossing the threshold and with no removal of a prior overlay — so
// collecting two orbs in one frame (easy with Magnet, or an explosion dropping a cluster) stacked
// two #cards overlays that shared the single global `choices`. The second call overwrote `choices`
// before the first overlay was dismissed, so clicking the stale one applied whatever card now sat
// at that index — sometimes a silent no-op. Now: N level-ups in a frame = N card screens in
// sequence, and a pick is never swallowed (2026-08-08). `pendingLevelUps` is declared up by
// continuesUsed — see the TDZ note there.
function offerCards(){
  // Re-entrancy guard is an explicit flag, NOT a document.getElementById('cards') probe: the
  // headless harness's fake DOM returns a truthy stub for EVERY id, so a DOM-based guard would
  // return early forever there and strand the game in state 'levelup' (2026-08-08).
  if(cardsOpen)return;
  pendingLevelUps=Math.max(0,pendingLevelUps-1);
  // S.7: weapon cards grant a MOD attached to the held weapon's ID. Skills are run-scoped, max 5.
  // rollChoices() guarantees slot 1 is an upgrade for the EQUIPPED weapon whenever one exists —
  // at every level-up now, not just the first three (see rollChoices()).
  choices=rollChoices(3,buildCardPool({allowEvo:true,bigHeal:false}));
  if(!choices.length)choices.push({name:'Press On',text:'Everything is maxed — keep fighting',apply:()=>{}});
  if(typeof HTMLElement==='undefined'){if(choices[0])choices[0].apply();cardPicks++;if(pendingLevelUps>0)return offerCards();state='play';return}
  let box=document.createElement('div');box.id='cards';box.className='overlay';
  box.innerHTML='<h2>LEVEL '+level+' — CHOOSE ONE</h2>'+choices.map((c,i)=>`<button data-card="${i}" style="width:280px;padding:16px;background:#16383a;color:#eafffa;border:1px solid #75f0db;border-radius:8px;text-align:left"><b style="display:flex;align-items:center">${cardIconHtml(c)}${c.name}</b><br><span style="opacity:.85">${c.text}</span></button>`).join('');
  document.body.append(box);cardsOpen=true;
  box.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{choices[Number(b.dataset.card)].apply();cardPicks++;box.remove();cardsOpen=false;if(pendingLevelUps>0)offerCards();else state='play'});
}
// ---- HiveWar-style stage debrief (count-up stats) then upgrade pick ----
let debriefT=0, debriefDone=false, debriefRowsCache=null, debriefLastVal={};
// CELEBRATION (owner 2026-08-09: "where are the fireworks and fanfare at end of stage screen like
// hive war"). Ported 1:1 from HiVE WAR's fireworkBurst()/updateDebrief()/drawDebrief()
// (D:\Dev\HiveWar\index.html): 72 gravity-fed sparks + two flash rings per burst, an opening
// 3-burst fanfare when the panel opens, then a burst every ~0.38s once the tally finishes.
// Fireworks live in SCREEN space (the debrief is an overlay, not world geometry) so they need no
// sx()/sy() and are unaffected by the camera.
let fireworks=[], fireT=0;
function fireworkBurst(){
  const W=VIEW.w,H=VIEW.h;
  const x=rand(70,W-70), y=rand(H*0.25,H*0.72);
  const hue=['#4ff','#f4f','#ff4','#6f9','#f86','#fff'][(Math.random()*6)|0];
  for(let i=0;i<72;i++){
    const a=Math.random()*6.283, sp=rand(120,420);
    fireworks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(.9,2.1),col:hue,r:rand(2.4,5.2)});
  }
  fireworks.push({x,y,vx:0,vy:0,life:.28,col:'#fff',r:38,flash:1});
  fireworks.push({x,y,vx:0,vy:0,life:.4,col:hue,r:54,flash:1});
  sfxFile('electric-explosive.mp3',.18);
}
function debriefCopy(){
  const stageName=(curStageCfg().name||'Sector');
  return {
    headline:stageName.toUpperCase()+' PURGED',
    kicker:'GUARDIAN DOWN',
    stageName,
    reward:'+250',
    continue:'TAP TO ADVANCE'
  };
}
window.__swarmDebriefCopy=debriefCopy;
function debriefRows(){
  if(debriefRowsCache)return debriefRowsCache;
  const rows=[];
  const kills=Object.values(runStats.killsBy||{}).sort((a,b)=>b.n-a.n);
  for(const k of kills)if(k.n>0)rows.push({label:k.name,value:k.n,col:k.color||'#9ef',kind:1});
  rows.push({label:'TOTAL KILLS',value:runStats.totalKills||0,big:true,col:'#4ff'});
  rows.push({label:'ORBS COLLECTED',value:runStats.orbs||0,col:'#6fffe2'});
  // OWNER 2026-08-12: "stop showing all weapons at level end."
  // This used to list every weapon in runStats.weaponsSeen — i.e. everything you'd touched all
  // run, including guns you no longer carry — which buried the stats that matter. The debrief now
  // reports only the weapons you are ACTUALLY HOLDING when the stage ends.
  const weps=Object.values(runStats.weaponsSeen||{}).filter(w=>heldWeapons.some(h=>h.id===w.id));
  for(const w of weps){
    const live=(heldWeapons.find(h=>h.id===w.id))||weaponById(w.id)||w;
    const rank=live.rank||w.rank||1;
    const mods=weaponMods[w.id]||{};
    const modTxt=Object.keys(mods).filter(k=>mods[k]>0).map(k=>k+' '+mods[k]+'/'+MOD_MAX).join(', ');
    rows.push({label:(live.name||w.name)+'  Rk.'+rank+(modTxt?' · '+modTxt:''),value:rank,col:live.color||'#ffe08a',wep:live,weapon:1});
  }
  debriefRowsCache=rows;return rows;
}
function startDebrief(){
  debriefT=0;debriefDone=false;debriefRowsCache=null;debriefLastVal={};
  fireworks=[];fireT=0;
  state='debrief';
  if(typeof HTMLElement==='undefined'){// harness: skip animation
    pendingStageAdvance=()=>offerStageBreak();return}
  // Opening fanfare: three staggered bursts, exactly like HiVE WAR's.
  for(let i=0;i<3;i++)setTimeout(()=>{if(state==='debrief')fireworkBurst()},i*120);
}
function updateDebrief(dt){
  if(state!=='debrief')return;
  debriefT+=dt;
  const rows=debriefRows();
  const full=rows.length*0.45+1.4;
  // Tally tick: one blip as each row lands, so the count-up has a rhythm instead of being silent.
  const shownRows=Math.min(rows.length,Math.floor(debriefT/0.45));
  if(shownRows>(debriefLastVal._rows||0)){debriefLastVal._rows=shownRows;sfxFile('money.mp3',.12)}
  if(!debriefDone&&debriefT>full){debriefDone=true;fireT=0}
  if(debriefDone){                       // celebration: a burst every ~0.38s, sometimes doubled
    fireT-=dt;
    if(fireT<=0){fireT=.38;fireworkBurst();if(Math.random()<.45)fireworkBurst()}
  }
  for(let i=fireworks.length-1;i>=0;i--){const f=fireworks[i];
    f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=210*dt;f.life-=dt;      // 210 px/s^2 gravity, same as HiVE WAR
    if(f.life<=0)fireworks.splice(i,1)}
}
function drawDebrief(){
  if(state!=='debrief')return;
  const W=VIEW.w,H=VIEW.h;
  ctx.save();
  ctx.fillStyle='rgba(2,8,16,.86)';ctx.fillRect(0,0,W,H);
  // OWNER 2026-08-12: "make att stats fill window end of level." The panel was capped at 520x560,
  // so on anything bigger than a phone the debrief was a small box marooned in the middle of the
  // screen. It now fills the window with a fixed margin, and the row pitch below scales to the
  // panel so a long kill list still fits instead of spilling out the bottom.
  // 2026-08-13 (owner: "the ending level stats window box is too big, make it 20% smaller and all
  // items fit inside"). PANEL_SHRINK backs the full-window panel off to 80% of the space it used to
  // take, on both axes, still centred. Everything below is measured off panelW/panelH rather than
  // the viewport, so the header, row pitch and footer all follow the panel down automatically —
  // the one exception was the row-pitch FLOOR, which is fixed in the pitch calculation below.
  const PANEL_SHRINK=.8;
  const panelW=(W-36)*PANEL_SHRINK,panelH=(H-56)*PANEL_SHRINK;
  const px0=(W-panelW)/2,py0=(H-panelH)/2;
  // Header/footer metrics were hardcoded for the old full-window panel (48/74/110/64/28 px). On a
  // panel that is now 20% shorter those constants ate a disproportionate slice of the height, so
  // they scale with the panel too. Clamped to 1 so this can never INFLATE on a huge monitor.
  const hs=Math.min(1,panelH/((H-56)||1));
  ctx.fillStyle='rgba(12,28,32,.96)';ctx.strokeStyle='#6fffe2';ctx.lineWidth=2;
  ctx.shadowColor='#6fffe2';ctx.shadowBlur=22;
  if(ctx.roundRect){ctx.beginPath();ctx.roundRect(px0,py0,panelW,panelH,14);ctx.fill();ctx.stroke()}
  else{ctx.fillRect(px0,py0,panelW,panelH);ctx.strokeRect(px0,py0,panelW,panelH)}
  ctx.shadowBlur=0;ctx.textAlign='center';
  const copy=debriefCopy();
  const pulse=.82+.18*Math.sin((debriefT||0)*6);
  ctx.save();
  ctx.shadowColor='#ffe066';ctx.shadowBlur=28;
  ctx.fillStyle=`rgba(255,224,102,${pulse})`;ctx.font=`900 ${Math.round(38*hs)}px system-ui`;
  ctx.fillText(copy.headline,W/2,py0+Math.round(46*hs));
  ctx.shadowColor='#6fffe2';ctx.shadowBlur=14;
  ctx.fillStyle='#6fffe2';ctx.font=`800 ${Math.round(16*hs)}px system-ui`;
  ctx.fillText(copy.kicker+'  ·  '+copy.reward,W/2,py0+Math.round(72*hs));
  ctx.restore();
  ctx.strokeStyle='rgba(255,224,102,.45)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(px0+28,py0+Math.round(86*hs));ctx.lineTo(px0+panelW-28,py0+Math.round(86*hs));ctx.stroke();
  const rows=debriefRows();
  // Row pitch fills the panel: spread rows over the space between the header and the footer, but
  // never stretch past 36px (the original look) and never squash below 22px (unreadable).
  const rowTop=py0+Math.round(110*hs), rowBottom=py0+panelH-Math.round(64*hs), avail=rowBottom-rowTop;
  // TEXT SCALE (owner 2026-08-13: "make stats larger on level clear"). The panel already fills the
  // window; now the type inside it scales with the row pitch instead of being fixed 14-18px, so a
  // short list on a big screen prints big. `fs` is the scale factor vs the old fixed sizes: pitch
  // maxes at 64 (was 36), so a typical debrief roughly doubles in size, and a long kill list still
  // shrinks back down to the readable 22px floor rather than overflowing.
  // FIT GUARANTEE (owner 2026-08-13: "and all items fit inside"). The old pitch had a HARD FLOOR of
  // 22px and the font scale had a hard floor of 1.0, so once rows.length*22 exceeded the available
  // height the list simply drew past the bottom of the panel and off the edge — the floors made
  // overflow inevitable rather than preventing it. Shrinking the panel 20% made that reachable with
  // far fewer rows, so the floors have to go: pitch is now exactly avail/rows when the list is
  // long, which fits BY CONSTRUCTION at any panel size or row count.
  const pitch=Math.min(64,rows.length>1?avail/rows.length:64);
  // Type follows the pitch all the way down instead of stopping at 1.0, so rows can never overlap
  // each other. The 0.55 floor is a legibility backstop for an absurd row count; below that the
  // list is unreadable anyway and clamping is preferable to sub-pixel text.
  const fs=Math.max(.55,Math.min(1.9,pitch/34));
  const px_=n=>Math.round(n*fs);
  // A short list (few enemy types killed) would otherwise bunch at the top of a now-full-screen
  // panel and leave a huge void — centre the block vertically when it doesn't fill the space.
  const startY=rowTop+Math.max(0,(avail-rows.length*pitch)/2);
  rows.forEach((r,i)=>{
    const appear=i*0.45, shown=debriefT-appear;if(shown<=0)return;
    const k=Math.min(1,shown/0.4), val=Math.round((r.value||0)*k*k);
    const y=startY+i*pitch;
    if(r.big){
      ctx.fillStyle='#fff';ctx.font=`900 ${px_(28)}px system-ui`;ctx.shadowColor='#4ff';ctx.shadowBlur=16;
      ctx.fillText(String(val),W/2,y);
      ctx.shadowBlur=0;ctx.fillStyle='#9ef';ctx.font=`700 ${px_(13)}px system-ui`;
      ctx.fillText(r.label,W/2,y+px_(18));
    }else{
      ctx.textAlign='left';ctx.fillStyle=r.col||'#dce9e7';ctx.font=`700 ${px_(15)}px system-ui`;
      const labelX=px0+28, chip=px_(22);
      if(r.wep){/* weapon chip — scales with the type so it doesn't float next to giant text */
        ctx.fillStyle=(r.wep.color||'#6ff')+'33';ctx.fillRect(labelX,y-chip*.73,chip,chip);
        ctx.strokeStyle=r.wep.color||'#6ff';ctx.strokeRect(labelX,y-chip*.73,chip,chip);
        ctx.fillStyle=r.wep.color||'#6ff';ctx.font=`900 ${px_(12)}px system-ui`;ctx.textAlign='center';
        ctx.fillText((r.wep.name||'?')[0],labelX+chip/2,y+px_(1));ctx.textAlign='left';
        ctx.fillStyle=r.col||'#dce9e7';ctx.font=`700 ${px_(14)}px system-ui`;
        ctx.fillText(r.label,labelX+chip+px_(8),y);
      }else{
        ctx.fillText(r.label,labelX,y);
      }
      ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font=`900 ${px_(18)}px system-ui`;
      ctx.fillText(String(val),px0+panelW-28,y);
      ctx.textAlign='center';
    }
  });
  // Fireworks paint OVER the panel (screen space, additive-ish glow) — HiVE WAR draws them in the
  // same slot, after the rows and before the continue prompt.
  for(const f of fireworks){
    ctx.globalAlpha=Math.max(0,Math.min(1,f.life));
    ctx.fillStyle=f.col;ctx.shadowColor=f.col;ctx.shadowBlur=f.flash?56:18;
    ctx.beginPath();ctx.arc(f.x,f.y,(f.r||3)*(f.flash?Math.max(.2,f.life/.28):1),0,7);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;
  if(debriefDone){
    const pulse=.7+.3*Math.sin(debriefT*5);
    ctx.fillStyle=`rgba(255,224,102,${pulse})`;ctx.font=`800 ${Math.round(17*hs)}px system-ui`;
    ctx.fillText(debriefCopy().continue,W/2,py0+panelH-Math.round(28*hs));
  }
  ctx.restore();
}
function finishDebrief(){
  if(state!=='debrief'||!debriefDone)return;
  offerStageBreak();
}
// Drone orbit motion — ported 1:1 from HiVE War's perkWeapons()/draw() (D:\Dev\HiveWar\index.html
// lines 1129-1141 and 3097-3103, owner 2026-08-08): angular speed 2.6 rad/s, evenly spaced by
// 2*PI/count, fixed orbit radius. HiVE War is a lane shooter and draws an ELLIPSE (x radius 82,
// y radius 34) because its "camera" is a fixed low-angle view of a squad; HiveSwarm is top-down, so
// the same 82px radius becomes a plain circle instead — same numbers, no perspective squash needed.
// This EXACT function drives both fireDrones() (below) and draw() so the muzzle flash / bullet
// origin always lines up with the drawn drone, never the player's own position.
// ORBIT RADIUS (owner 2026-08-12: "make drones circle player more closely"). 82 -> 52.
// One constant only: droneOrbitAngle()/fireDrones()/draw() all read it, so the drawn drone, its
// muzzle flash and its bullet origin stay locked together — do NOT hardcode a radius anywhere else.
// 52 keeps them clear of the player's own 1.8*r barrel tip (~29px) so shots don't spawn inside the
// hull, while reading as a tight escort ring instead of a wide, detached halo.
const DRONE_ORBIT_R=52, DRONE_ANGVEL=2.6;
function droneOrbitAngle(i,n){return elapsed*DRONE_ANGVEL+i*(Math.PI*2/Math.max(1,n))}
function droneRate(){return Math.max(.05,.32*Math.pow(.85,droneModN('dronerate')))} // same -15%/stack curve as wRate()
function fireDrones(){
  // Drone Escort skill: orbiting drones fire WITH the player but FROM THEIR OWN world position
  // (ox,oy below) — never player.x/player.y — so drone shots visibly originate at the orbiting
  // sprite drawn in draw(), matching HiVE War's "drone shots are their own emitter" behaviour.
  const n=skillN('drone');if(!n)return;
  const t=nearestEnemy(player);if(!t)return;
  const dmg=(6+n*2)*(1+.25*droneModN('dronedmg'));
  for(let i=0;i<n;i++){
    const wp=droneWorld(i,n), a=droneAimAt(wp.x,wp.y), tip=droneDrawSize()*DRONE_MUZZLE, sp=520;
    bullets.push({x:wp.x+Math.cos(a)*tip,y:wp.y+Math.sin(a)*tip,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:3,damage:dmg,pierce:0,life:.7,color:'#9ef',kind:'bullet',kb:0,shards:0,trail:[],bounces:0});
  }
}
// STAGE break: after debrief, pick a reward then advance.
function offerStageBreak(){
  const clearedCfg=curStageCfg();

  // previously had none at all.
  choices=rollChoices(3,buildCardPool({allowEvo:false,bigHeal:true}));
  if(!choices.length)choices.push({name:'Press On',text:'No upgrades available — deploy anyway',apply:()=>{}});
  const advance=()=>{
    stage++;genObstacles();stageT=0;stageWave=0;waveSpawned=0;waveNoKillT=0;waveStallHp=Infinity;stageBoss=null;bossPendingT=0;bossPendingCfg=null;bossAddBudget=0;bossAddSpawned=0;bossStallT=0;bossStallHp=Infinity;
    enemies=[];bullets=[];beams=[];
    // Keep cumulative run stats; only clear per-stage kill ledger so next debrief is stage-local.
    runStats.killsBy={};runStats.totalKills=0;runStats.orbs=0;
    player.hp=Math.min(player.maxHp,player.hp+Math.round(player.maxHp*.25));
    state='play';
  };

  box.innerHTML='<h2>STAGE '+(stage+1)+' REWARD</h2><div class="hint">'+clearedCfg.name+' cleared · pick one, then deploy Stage '+(stage+2)+'</div>'+
    choices.map((c,i)=>`<button data-card="${i}" style="width:280px;padding:16px;background:#16383a;color:#eafffa;border:1px solid #75f0db;border-radius:8px;text-align:left"><b style="display:flex;align-items:center">${cardIconHtml(c)}${c.name}</b><br><span style="opacity:.85">${c.text}</span></button>`).join('');
  document.body.append(box);
  box.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{choices[Number(b.dataset.card)].apply();box.remove();pendingStageAdvance=advance});

}

/** Unified left-rail asset list for ENTITIES editor: player, enemies, weapons, items. */
function entityAssets(){
  const list=[];
  list.push({cat:'player',color:'#6fffe2',title:'Twin Pod',key:'player',path:PLAYER_SPRITE,kind:'player',
    stats:()=>EDIT.player, statPath:'player'});
  (EDIT.entities||[]).forEach((e,i)=>list.push({cat:'enemy',color:e.color||'#9ab0b4',title:e.name||e.id,key:entitySpriteKey(e),path:e.sprite||'',kind:'entity',idx:i,
    stats:()=>EDIT.entities[i], statPath:'entities.'+i}));
  (EDIT.weapons||[]).forEach((w,i)=>list.push({cat:'weapon',color:w.color||'#ffe066',title:w.name||w.id,key:'weapon:'+w.id,path:'',kind:'weapon',idx:i,
    stats:()=>EDIT.weapons[i], statPath:'weapons.'+i}));

}
const BEAST_CAT_COL={player:'#6fffe2',enemy:'#f88',weapon:'#ffe066',item:'#8aff9b',boss:'#c6f',lore:'#9ab'};
function weaponIconDraw(cv, w){
  if(!cv||!w)return;
  const g=cv.getContext('2d');const W=cv.width,H=cv.height;
  g.clearRect(0,0,W,H);g.fillStyle='#071215';g.fillRect(0,0,W,H);
  const iconIdx=w.icon|0;
  const sheet=spriteFor('assets/weapon_icons.png');
  if(sheet&&sheet.complete&&sheet.naturalWidth){
    const cell=sheet.naturalHeight||128;
    const cols=Math.max(1,Math.floor(sheet.naturalWidth/cell));
    const i=((iconIdx%cols)+cols)%cols;
    g.imageSmoothingEnabled=false;
    g.drawImage(sheet,i*cell,0,cell,cell,4,4,W-8,H-8);
    return;
  }
  // fallback procedural gun glyph tinted with weapon color
  g.fillStyle=w.color||'#6fffe2';g.shadowColor=w.color||'#6fffe2';g.shadowBlur=10;
  g.fillRect(W*.2,H*.42,W*.55,H*.16);
  g.fillRect(W*.68,H*.34,W*.12,H*.32);
  g.beginPath();g.arc(W*.28,H*.5,H*.14,0,7);g.fill();
  g.shadowBlur=0;
}
function pickupIconDraw(cv,w){
  if(!cv||!w)return;
  const g=cv.getContext('2d');const W=cv.width,H=cv.height;
  g.clearRect(0,0,W,H);g.fillStyle='#071215';g.fillRect(0,0,W,H);
  const col=w.color||'#ffe08a';
  // Matches in-game weapon pickup: glowing capsule + dark sight
  g.save();g.translate(W/2,H/2);
  g.shadowColor='#ffd76a';g.shadowBlur=12;g.fillStyle=col;
  g.fillRect(-14,-7,28,14);
  g.fillStyle='#111';g.fillRect(-4,-12,8,6);
  g.restore();
}

  const img=pg?CODEX_IMG[pg.id]:null;
  body.innerHTML=`<div class="hint">Field guide. Pages unlock in-game on first sighting. Progress is per save slot. Asset paint tools are on the <b>ENTITIES</b> tab.</div>
    <div class="entSplit">
      <div class="entLeft">${list||'<div class="hint">No pages.</div>'}
        <button id="cxAdd" style="width:100%;margin-top:8px">+ ADD PAGE</button>
        <button id="cxReset" class="warn" style="width:100%;margin-top:4px">RESET DEFAULT PAGES</button>
        <button id="cxRelock" class="warn" style="width:100%;margin-top:4px">RE-LOCK ALL (this slot)</button></div>
      <div class="entRight">${pg?`
        <div class="row">CATEGORY <select id="cxCat">${CODEX_CATS.map(c=>`<option value="${c}" ${c===pg.cat?'selected':''}>${c}</option>`).join('')}</select></div>
        <div class="row">TITLE <input type="text" id="cxTitle" value="${esc(pg.title)}" style="width:min(220px,100%)"></div>
        <div class="row">SUBTITLE <input type="text" id="cxSub" value="${esc(pg.subtitle)}" style="width:min(220px,100%)"></div>
        <div class="row">UNLOCK KEY <input type="text" id="cxLink" value="${esc(pg.link)}" placeholder="enemy:enemy.shambler" style="width:min(200px,100%)">
          <span class="hint">${pg.link?(META.codexSeen&&META.codexSeen[pg.link]!==undefined?'<b style="color:#6f6">UNLOCKED</b>':'<b style="color:#f84">LOCKED</b>')+' slot '+currentSlot():'<b style="color:#6f6">ALWAYS VISIBLE</b>'}</span></div>
        <div class="row">BODY <textarea id="cxBody">${esc(pg.body)}</textarea></div>
        <div class="row"><button id="cxPick">🖼 UPLOAD IMAGE</button>
          <button id="cxClr" class="warn" ${img?'':'disabled'}>REMOVE IMAGE</button>
          <input type="file" id="cxFile" accept="image/*" style="display:none"></div>
        <div class="row">${img?`<img src="${img}" alt="" style="max-width:min(220px,100%);max-height:140px;border:1px solid #245">`:'<span class="hint">No image yet.</span>'}</div>
        <div class="row"><button id="cxDel" class="warn">DELETE PAGE</button></div>`:'<div class="hint">Add a page.</div>'}</div></div>`;
  body.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{codexSel=+b.dataset.pick;renderCodex()});
  body.querySelector('#cxAdd').onclick=()=>{codexPages().push({id:codexNewId(),cat:'enemy',title:'New Entry',subtitle:'',body:'',link:''});codexSel=codexPages().length-1;persistForge();renderCodex()};
  body.querySelector('#cxRelock').onclick=()=>{if(!confirm('Re-lock every beastiary page in save slot '+currentSlot()+'?'))return;META.codexSeen={};saveMeta();renderCodex()};
  body.querySelector('#cxReset').onclick=()=>{if(!confirm('Replace ALL beastiary pages with shipped defaults?'))return;EDIT.codexPages=codexDefaults();codexSel=0;persistForge();renderCodex()};
  if(!pg)return;
  const bind=(sel,key)=>{const el=body.querySelector(sel);if(!el)return;el.oninput=()=>{pg[key]=el.value;persistForge()}};
  bind('#cxTitle','title');bind('#cxSub','subtitle');bind('#cxBody','body');bind('#cxLink','link');
  body.querySelector('#cxCat').onchange=e=>{pg.cat=e.target.value;persistForge();renderCodex()};
  body.querySelector('#cxPick').onclick=()=>body.querySelector('#cxFile').click();
  body.querySelector('#cxFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{CODEX_IMG[pg.id]=rd.result;saveCodexMedia(pg.id).then(()=>renderCodex()).catch(()=>alert('Could not store image in IndexedDB.'))};rd.readAsDataURL(f)};
  body.querySelector('#cxClr').onclick=()=>{delete CODEX_IMG[pg.id];saveCodexMedia(pg.id).then(()=>renderCodex())};
  body.querySelector('#cxDel').onclick=()=>{if(!confirm('Delete "'+(pg.title||'untitled')+'"?'))return;delete CODEX_IMG[pg.id];saveCodexMedia(pg.id).catch(()=>{});codexPages().splice(codexSel,1);codexSel=Math.max(0,codexSel-1);persistForge();renderCodex()};
}

window.__hiveSwarmForge=()=>copy(EDIT);
// Test-only hook (headless verification, no player-facing surface) so a QA harness can drive
// the Forge UI itself — open a tab, read its rendered HTML — without a real browser/DOM parser.
window.__hiveSwarmForgeUI={open:openForge,setTab:v=>{tab=v;renderTab()},html:()=>body.innerHTML,tabs:()=>TABS.slice()};
}catch(err){console.error('FORGE init failed',err)}
})();
</script></body></html>
